<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baromètre Macro-Financier — KEDGE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0a0e1a; --surface: #111827; --surface2: #1a2235;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #e8edf5; --muted: #6b7a99;
    --green: #22d3a0; --amber: #f5a623; --red: #f05252; --purple: #8b7cf8; --blue: #4fa3f7;
    --green-bg: rgba(34,211,160,0.1); --amber-bg: rgba(245,166,35,0.1);
    --red-bg: rgba(240,82,82,0.1); --purple-bg: rgba(139,124,248,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; font-size: 14px; line-height: 1.6; }
  .grid-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: linear-gradient(rgba(139,124,248,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(139,124,248,0.03) 1px, transparent 1px);
    background-size: 40px 40px; }
  .app { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2.5rem; gap: 1rem; flex-wrap: wrap; }
  .logo-area { display: flex; align-items: center; gap: 12px; }
  .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--purple); box-shadow: 0 0 10px rgba(139,124,248,0.6); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }
  .header-title { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: 'DM Mono', monospace; }
  .lang-toggle { display: flex; background: var(--surface); border: 1px solid var(--border2); border-radius: 20px; overflow: hidden; }
  .lang-btn { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; padding: 5px 14px; cursor: pointer; border: none; background: transparent; color: var(--muted); transition: all 0.18s; }
  .lang-btn.active { background: var(--purple-bg); color: var(--purple); }
  .status-bar { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .status-pill { font-size: 11px; font-family: 'DM Mono', monospace; padding: 4px 12px; border-radius: 20px; border: 1px solid; }
  .pill-ok { color: var(--green); border-color: rgba(34,211,160,0.3); background: rgba(34,211,160,0.06); }
  .pill-loading { color: var(--amber); border-color: rgba(245,166,35,0.3); background: rgba(245,166,35,0.06); }
  .hero { display: grid; grid-template-columns: auto 1fr; gap: 20px; margin-bottom: 1.5rem; }
  .score-main { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 1.5rem 2rem; min-width: 200px; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .score-number { font-size: 56px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; font-family: 'DM Mono', monospace; }
  .score-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; }
  .badge-bull { background: var(--green-bg); color: var(--green); }
  .badge-neu  { background: var(--amber-bg); color: var(--amber); }
  .badge-bear { background: var(--red-bg);   color: var(--red); }
  .metrics-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .ai-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .charts-row { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin-bottom: 1.5rem; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; }
  #keySection { display: none !important; } /* Hidden key section */
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="app">
  <div class="header">
    <div class="logo-area">
      <div class="logo-dot"></div>
      <div>
        <div class="header-title" data-i18n="title"></div>
        <div class="header-sub" data-i18n="subtitle"></div>
      </div>
    </div>
    <div class="header-right">
      <div class="lang-toggle">
        <button class="lang-btn active" id="btnFR" onclick="setLang('fr')">FR</button>
        <button class="lang-btn" id="btnEN" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span class="status-pill pill-loading" id="st-fred"></span>
    <span class="status-pill pill-loading" id="st-yf"></span>
    <span class="status-pill pill-loading" id="st-score"></span>
  </div>

  <div class="hero">
    <div class="score-main">
      <div class="score-label-sm" data-i18n="scoreLabel"></div>
      <div class="score-number" id="scoreNum">—</div>
      <div class="score-badge badge-neu" id="scoreBadge"><span id="badgeText">...</span></div>
    </div>
    <div class="metrics-grid" id="metricsGrid"></div>
  </div>

  <div class="ai-card">
    <div id="aiBody" class="ai-body">Chargement de l'analyse...</div>
  </div>

  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-card-title" data-i18n="chartHistory"></div>
      <div style="height:220px;"><canvas id="lineChart"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-card-title" data-i18n="chartContrib"></div>
      <div class="contrib-list" id="contribList"></div>
    </div>
  </div>
</div>

<script>
const STRINGS = {
  fr: {
    title: 'Baromètre Macro-Financier', subtitle: 'KEDGE Business School — Asset Management 2025–2026',
    scoreLabel: 'Score Global', bull: 'HAUSSIER', neu: 'NEUTRE', bear: 'BAISSIER',
    stFredLoading: 'FRED : Connexion...', stFredOk: 'FRED : En direct', stYfOk: 'Yahoo : En direct',
    chartHistory: 'Historique du Score', chartContrib: 'Contributions', weightLbl: (w) => `${w}% poids`
  },
  en: {
    title: 'Macro-Financial Barometer', subtitle: 'KEDGE Business School — Asset Management 2025–2026',
    scoreLabel: 'Global Score', bull: 'BULLISH', neu: 'NEUTRAL', bear: 'BEARISH',
    stFredLoading: 'FRED: Connecting...', stFredOk: 'FRED: Live', stYfOk: 'Yahoo: Live',
    chartHistory: 'Score History', chartContrib: 'Contributions', weightLbl: (w) => `${w}% weight`
  }
};

let lang = 'fr', liveData = {}, fredKey = '29e15aa636c068e802af1966e1da4da8';

const INDICATORS = [
  { id:'gdp', name:'PIB Mondial', ticker:'NY.GDP.MKTP.KD.ZG', display:'%', weight:0.10, inverted:false },
  { id:'cpi', name:'CPI Inflation', ticker:'CPIAUCSL', display:'idx', weight:0.20, inverted:true },
  { id:'tnx', name:'Taux US 10Y', ticker:'^TNX', display:'%', weight:0.15, inverted:false },
  { id:'msci', name:'MSCI World', ticker:'URTH', display:'USD', weight:0.25, inverted:false },
  { id:'vix', name:'VIX', ticker:'^VIX', display:'pts', weight:0.15, inverted:true },
  { id:'brent', name:'Brent', ticker:'BZ=F', display:'$/bbl', weight:0.10, inverted:true },
  { id:'dxy', name:'DXY', ticker:'DX-Y.NYB', display:'idx', weight:0.05, inverted:true }
];

const FALLBACK = { gdp:{value:2.9,history:[2.5,2.9]}, cpi:{value:4.1,history:[3.0,4.1]}, tnx:{value:4.2,history:[3.5,4.2]}, msci:{value:180,history:[150,180]}, vix:{value:20,history:[15,20]}, brent:{value:80,history:[70,80]}, dxy:{value:100,history:[95,100]} };

function t(k, ...a) { return STRINGS[lang][k] || k; }

window.onload = () => { applyLang(); loadAllData(); };

async function loadAllData() {
  const [fOk, yOk] = await Promise.all([loadFredData(), loadYahooData()]);
  document.getElementById('st-fred').textContent = fOk ? t('stFredOk') : 'FRED: Fallback';
  document.getElementById('st-yf').textContent = yOk ? t('stYfOk') : 'Yahoo: Fallback';
  computeAndRender();
}

async function loadFredData() {
  try {
    const fetchF = async (id) => {
      const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://fred.stlouisfed.org/graph/fredgraph.csv?id=${id}&limit=60&sort_order=desc&api_key=${fredKey}`)}`);
      const j = await r.json();
      return j.contents.trim().split('\n').slice(1).map(l => parseFloat(l.split(',')[1])).filter(v => !isNaN(v));
    };
    const cpi = await fetchF('CPIAUCSL'); liveData.cpi = { value: cpi[0], history: cpi.reverse() };
    const gdp = await fetchF('A191RL1A225NBEA'); liveData.gdp = { value: gdp[0], history: gdp.reverse() };
    return true;
  } catch { liveData.cpi = FALLBACK.cpi; liveData.gdp = FALLBACK.gdp; return false; }
}

async function loadYahooData() {
  const ticks = { tnx:'^TNX', msci:'URTH', vix:'^VIX', brent:'BZ=F', dxy:'DX-Y.NYB' };
  let ok = false;
  await Promise.all(Object.entries(ticks).map(async ([id, s]) => {
    try {
      const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${s}?interval=1mo&period1=${Math.floor(Date.now()/1000)-5000000}&period2=${Math.floor(Date.now()/1000)}`)}`, {signal: AbortSignal.timeout(15000)});
      const j = await r.json(); const d = JSON.parse(j.contents);
      const c = d.chart.result[0].indicators.quote[0].close.filter(v=>v!=null);
      liveData[id] = { value: c[c.length-1], history: c }; ok = true;
    } catch { liveData[id] = FALLBACK[id]; }
  }));
  return ok;
}

function computeZ(h) {
  const m = h.reduce((a,b)=>a+b,0)/h.length;
  const s = Math.sqrt(h.reduce((a,v)=>a+Math.pow(v-m,2),0)/(h.length-1)) || 1;
  return (h[h.length-1]-m)/s;
}

function computeAndRender() {
  const res = INDICATORS.map(i => {
    const d = liveData[i.id] || FALLBACK[i.id];
    let z = computeZ(d.history); if(i.inverted) z = -z;
    return { ...i, value: d.value, z, contrib: z*i.weight };
  });
  const score = parseFloat(Math.max(-10, Math.min(10, res.reduce((a,b)=>a+b.contrib,0)*3)).toFixed(2));
  renderScore(score); renderMetrics(res); runAI(res, score);
}

function renderScore(s) {
  const el = document.getElementById('scoreNum'); el.textContent = (s>=0?'+':'')+s;
  const b = document.getElementById('scoreBadge');
  b.className = 'score-badge ' + (s>=2?'badge-bull':s<=-2?'badge-bear':'badge-neu');
  document.getElementById('badgeText').textContent = s>=2?t('bull'):s<=-2?t('bear'):t('neu');
}

function renderMetrics(res) {
  document.getElementById('metricsGrid').innerHTML = res.map(r => `
    <div class="metric-card">
      <div class="metric-name">${r.name}</div>
      <div class="metric-value">${r.value.toFixed(2)}</div>
      <div style="color:${r.z>=0?'#22d3a0':'#f05252'}">Z: ${r.z.toFixed(2)}σ</div>
    </div>`).join('');
}

// AI — calls /api/claude (our Vercel proxy), no CORS issues
async function runAI(results, score) {
  const aiBody = document.getElementById('aiBody');
  const btn = document.getElementById('aiRefreshBtn');
  btn.disabled = true;
  aiBody.className = 'ai-body ai-loading-text';
  aiBody.textContent = "Génération de l'analyse Claude...";

  const label = score >= 2 ? "HAUSSIER" : score <= -2 ? "BAISSIER" : "NEUTRE";
  const ctx = results.map(x => `- ${x.name}: Z=${x.z.toFixed(2)}σ`).join('\n');

  try {
    // THIS LINE IS THE KEY: It calls YOUR Vercel function, not Anthropic
    const res = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ score, label, ctx })
    });

    if (!res.ok) throw new Error('Erreur Serveur Vercel');

    const data = await res.json();
    aiBody.className = 'ai-body';
    aiBody.style.color = 'var(--text)';
    aiBody.innerHTML = data.text; // Displays the professional Claude response
  } catch (e) {
    console.error("AI Error:", e);
    aiBody.textContent = "Erreur de connexion avec Claude via Vercel.";
  }
  btn.disabled = false;
}
</script>
</body>
</html>
